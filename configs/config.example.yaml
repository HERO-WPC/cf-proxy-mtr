# cf-route-tester 配置示例
#
# ============================================================================
# 重要：当前版本**不读取这个文件**。
# ============================================================================
#
# 现阶段的实现是"纯命令行参数"：所有可配置项都通过 flag 传入
# （见 `cf-route-tester <command> --help`）。本文件是**设计草案**，
# 记录了配置项应当长什么样，等配置文件解析真正实现后才会被读取。
#
# 为什么仍然把它留在仓库里：
#   1. 它是一个明确的设计意图记录，避免将来实现时随手发明另一套键名；
#   2. 它列出了各项的合理默认值（并发数、超时），与代码里的默认值一致；
#   3. 它写明了"上传的 Token 只能来自环境变量"这条硬约束，
#      这条约束在实现之前就必须先定下来，否则很容易被违反。
#
# 如果你现在就想要这些设置，请用对应的命令行参数，例如：
#
#   cf-route-tester probe --workers 100 --timeout 3s
#   cf-route-tester scan  --workers 100 --timeout 3s --db data/results.db
#   cf-route-tester scan  --trace --trace-binary "C:/Tools/nexttrace.exe" --trace-mode tcp
#   cf-route-tester trace --target 1.1.1.1:443 --binary nexttrace --timeout 15s
#
# 注意：本文件中**不允许**出现任何密钥（例如 GitHub Token）。
#       Token 只能来自环境变量，绝不能进仓库。

source:
  # all.json 主数据源。
  url: "https://zip.cm.edu.kg/all.json"
  # 备用数据源：仅在主 URL 失败时使用。
  fallback_url: "https://zip.cm.edu.kg/all.txt"
  # 本地缓存路径。下载成功后写入这里，后续优先读取缓存。
  cache: "data/all.json"
  # 单次 HTTP 请求超时。
  timeout: 30s
  # 失败重试次数（不含首次请求）。
  retries: 3

probe:
  # TCP Probe 并发 worker 数量（网络 IO 为主，不要设得过高）。
  workers: 100
  # 单个 TCP 连接超时。
  timeout: 3s

trace:
  # 是否在扫描时执行线路跟踪。
  enabled: true
  # NextTrace 并发数量。必须显著小于 probe.workers，
  # 因为每个 worker 都会启动一个外部进程。
  workers: 10
  # 单个 NextTrace 进程超时。
  timeout: 15s
  # 跟踪模式：tcp / icmp / udp。默认 tcp，
  # 因为本项目测的是 IP:Port，TCP 更有意义。
  mode: tcp
  # 扫描时的跟踪范围：
  #   tcp-success（默认）：只跟踪 TCP Probe 成功的目标
  #   all：无论 TCP 是否成功都尝试跟踪（等价于 --trace-all）
  scope: tcp-success
  nexttrace:
    # nexttrace 可执行文件路径。
    # 可以只写 "nexttrace"（从 PATH 查找），
    # 也可以用绝对路径，例如 Windows: "C:/Tools/nexttrace.exe"。
    binary: "nexttrace"

storage:
  # 本地 SQLite 数据库路径。历史数据只追加，不覆盖。
  sqlite: "data/results.db"

collector:
  # 测量者信息。留空表示需要自动检测（Phase 6 实现 detect 命令）。
  # 手动填写优先：公网 ASN 不一定等于实际接入线路。
  country: ""
  province: ""
  city: ""
  isp: ""
  asn: ""
  # ipv4 或 ipv6。
  ip_version: "ipv4"

export:
  # 导出目录。
  dir: "output"
  # measurements.jsonl / traces.jsonl 的压缩方式：none / gzip / zstd
  compression: "gzip"

upload:
  # GitHub 数据仓库（owner/repo）。
  repository: ""
  # 分支。
  branch: "main"
  # 目标目录前缀。实际上传路径为 <prefix>/<YYYY-MM-DD>/collector-xxxx-NNN.jsonl.gz
  path_prefix: "data/raw"
  # Token 变量的名字。Token 本身只能来自环境变量，绝不能写在这里。
  token_env: "GITHUB_TOKEN"

log:
  # 日志级别：info / debug / warn / error
  level: "info"
  # 是否显示单个目标的细节（等价于 --verbose）。
  verbose: false
