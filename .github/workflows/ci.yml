name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 只读权限：CI 不需要写仓库，也不需要任何密钥。
permissions:
  contents: read

jobs:
  test:
    name: test / vet / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 必须 >= go.mod 中声明的版本。SQLite 驱动
          # modernc.org/sqlite 自身要求 go 1.26，因此这里不能更低。
          go-version: "1.26.x"

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test ./... -count=1 -race

      - name: go build
        run: go build ./...

      - name: Cross compile check (linux/darwin/windows)
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" go build ./...
          done

      - name: Verify CGO is not required (pure-Go SQLite)
        run: |
          # 需求要求 Windows 双击 exe 可用、并支持交叉编译，
          # 因此整个构建链必须能在 CGO_ENABLED=0 下完成。
          # 一旦有人引入需要 CGO 的依赖，这一步会立刻失败。
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build ./...

      - name: Smoke test the built binary
        run: |
          # 端到端冒烟：建库、迁移、查看状态。
          # 这一步验证的是"二进制真的能打开 SQLite 并读写"，
          # 而单元测试只覆盖包级行为。
          go build -o /tmp/cf-route-tester ./cmd/cf-route-tester
          /tmp/cf-route-tester version
          /tmp/cf-route-tester db migrate --db /tmp/ci-results.db
          /tmp/cf-route-tester db stats --db /tmp/ci-results.db

      - name: Full local pipeline smoke test
        run: |
          # 从 scan/probe 到 export 到 aggregate/query 的完整链路。
          #
          # 设计原则：**不依赖外网可达性**。CI 的失败原因必须是代码
          # 问题，而不是"某个公网 IP 今天不通"或"上游数据源挂了"。
          #
          # 做法：用一份本地缓存走离线路径（--fallback-url "" 让缓存
          # 未命中直接失败，而不是偷偷联网）。
          #
          # 目标地址必须是**公网**地址：1.1.1.1 / 8.8.8.8 通不通都
          # 无所谓（超时样本同样入库、同样导出），但如果用内网地址，
          # 导出时会被隐私过滤器正确丢弃，导入出为空、后面的断言
          # 全部失去意义——这一点实测踩过。
          set -e

          work="$(mktemp -d)"
          db="$work/results.db"
          csv="$work/results.csv"
          identity="$work/collector.json"
          out="$work/batch.jsonl.gz"

          # 缓存文件用本工具自己的写缓存函数生成。
          #
          # 不能把上游的原始 JSON 直接交给 --cache：--cache 读的是
          # 工具自己的缓存格式（source.WriteCache 的产物，含
          # schema_version / source / stats / targets），
          # 手工拼那个格式必然与实现漂移。
          go run ./tools/write-cache \
            -out "$work/all.json" \
            -target 1.1.1.1:80 \
            -target 8.8.8.8:53

          source_flags=(--url https://zip.cm.edu.kg/all.json
                        --fallback-url "" --cache "$work/all.json" --source-retries 0)

          # scan 只写 CSV：没有数据库、没有会话、没有续测。
          #
          # 表头是契约（列名与列序），因此这里断言它而不只是断言
          # "文件非空"——列错了下游的表格工具会静默读错列。
          /tmp/cf-route-tester scan "${source_flags[@]}" \
            --out "$csv" --identity "$identity" \
            --workers 2 --timeout 1s --quiet

          test -s "$csv"
          head -1 "$csv" | grep -q '^timestamp_utc,target,ip,port,success,latency_ms,error_type,error_message,hop_count,as_path,hops,client_version$'
          # 两个目标 + 表头 = 3 行。
          test "$(wc -l < "$csv")" -eq 3

          # probe 仍然写数据库，用它覆盖 export/aggregate/query 那条链路。
          /tmp/cf-route-tester probe "${source_flags[@]}" \
            --db "$db" --identity "$identity" \
            --workers 2 --timeout 1s --quiet
          /tmp/cf-route-tester db stats --db "$db"

          # export：公开 JSONL。目标都是公网地址，因此必然有内容。
          /tmp/cf-route-tester export --db "$db" --identity "$identity" \
            --out "$out" --quiet

          test -s "$out"
          gzip -t "$out"

          # 隐私回归：导出物里绝不能出现内网 / 环回 / 保留地址。
          if gzip -dc "$out" | grep -Eq '(10|127|169\.254|172\.(1[6-9]|2[0-9]|3[01])|192\.168|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7]))\.'; then
            echo "private address leaked into the export:"
            gzip -dc "$out"
            exit 1
          fi

          # aggregate 与 query 消费同一份产物。
          /tmp/cf-route-tester aggregate --input "$out" --quiet >/dev/null
          /tmp/cf-route-tester query 1.1.1.1:80 --input "$out" --quiet >/dev/null
          /tmp/cf-route-tester query --stats --input "$out" --quiet >/dev/null

      - name: Release tool self-check
        run: |
          # 发布工具的命名规则与校验和格式属于发布产物的一部分，
          # 写错了用户就没法校验。这里只跑它的单元测试，
          # 不真的交叉编译（那会拖慢 CI，且已由上面的步骤覆盖）。
          go test ./tools/release/ -count=1
