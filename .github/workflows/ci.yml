name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 只读权限：CI 不需要写仓库，也不需要任何密钥。
permissions:
  contents: read

jobs:
  test:
    name: test / vet / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 必须 >= go.mod 中声明的版本。SQLite 驱动
          # modernc.org/sqlite 自身要求 go 1.26，因此这里不能更低。
          go-version: "1.26.x"

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test ./... -count=1 -race

      - name: go build
        run: go build ./...

      - name: Cross compile check (linux/darwin/windows)
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" go build ./...
          done

      - name: Verify CGO is not required (pure-Go SQLite)
        run: |
          # 需求要求 Windows 双击 exe 可用、并支持交叉编译，
          # 因此整个构建链必须能在 CGO_ENABLED=0 下完成。
          # 一旦有人引入需要 CGO 的依赖，这一步会立刻失败。
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build ./...

      - name: Smoke test the built binary
        run: |
          # 端到端冒烟：建库、迁移、查看状态。
          # 这一步验证的是"二进制真的能打开 SQLite 并读写"，
          # 而单元测试只覆盖包级行为。
          go build -o /tmp/cf-route-tester ./cmd/cf-route-tester
          /tmp/cf-route-tester version
          /tmp/cf-route-tester db migrate --db /tmp/ci-results.db
          /tmp/cf-route-tester db stats --db /tmp/ci-results.db
